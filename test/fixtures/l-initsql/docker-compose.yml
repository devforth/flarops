services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: seedpw
      POSTGRES_DB: inventory
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
  api:
    build: ./backend
    ports: ["3000:3000"]
    environment:
      DB_HOST: db
      DB_NAME: inventory
    depends_on: [db]
