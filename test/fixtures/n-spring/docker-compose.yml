services:
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: springpw
      POSTGRES_DB: springdb
  api:
    build: ./backend
    ports: ["8080:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/springdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: springpw
    depends_on: [db]
