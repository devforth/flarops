services:
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: appdb
  cache:
    image: redis:7
    command: ["redis-server","--requirepass","${REDIS_PASSWORD}"]
  api:
    build: ./backend
    ports: ["3000:3000"]
    environment:
      DB_PASSWORD: ${DB_PASS}
      REDIS_HOST: cache
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on: [db, cache]
