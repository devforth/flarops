services:
  api:
    build: ./backend
    ports: ["4000:4000"]
    environment:
      PORT: 4000
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    depends_on: [tunnel]
  tunnel:
    image: cloudflare/cloudflared:2024.6.1
    command: ["tunnel", "run"]
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
