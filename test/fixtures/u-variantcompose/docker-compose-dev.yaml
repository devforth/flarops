services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: pw
      POSTGRES_DB: shopdb
  cache:
    image: redis:7
  api:
    build: ./api
    ports: ["3000:3000"]
    environment:
      REDIS_HOST: cache
      DB_HOST: db
    depends_on: [db, cache]
  worker:
    build: ./worker
    command: ["node", "worker.js"]
    depends_on: [db]
  legacy:
    build:
      context: ../elsewhere
