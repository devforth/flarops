services:
  cache:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - cachedata:/data
  broker:
    image: rabbitmq:3
    environment:
      RABBITMQ_DEFAULT_PASS: brokerpw
    volumes:
      - brokerdata:/var/lib/rabbitmq
  api:
    build: ./backend
    ports: ["3000:3000"]
    environment:
      REDIS_HOST: cache
    depends_on: [cache, broker]
volumes:
  cachedata:
  brokerdata:
