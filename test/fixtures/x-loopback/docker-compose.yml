services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: pw
      POSTGRES_DB: shopdb
  backend:
    build: ./backend
    ports: ["5000:5000"]
    environment:
      PORT: 5000
      DB_HOST: db
      SELF_CALLBACK_URL: http://localhost:5000/hooks
      METRICS_ENDPOINT: http://localhost:9411/spans
    depends_on: [db]
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    environment:
      VITE_API_URL: http://localhost:5000/api
      VITE_BACKEND_URL: http://localhost:5000
