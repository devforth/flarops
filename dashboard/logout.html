{{define "logout.html"}}<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Flarops — Sign out</title>
  <style nonce="{{.Nonce}}">
    :root {
      --bg: #EEF0F4;
      --surface: #FFFFFF;
      --line: rgba(20, 28, 45, .12);
      --text: #12161D;
      --text-2: #4B5464;
      --brass: #8A6A16;
      --brass-2: #A8842A;
      --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 24px -12px rgba(16, 24, 40, .28);
      --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0D1016;
        --surface: #161A22;
        --line: rgba(255, 255, 255, .09);
        --text: #E6EAF1;
        --text-2: #A2AAB9;
        --brass: #D9A94A;
        --brass-2: #C79A46;
        --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -14px rgba(0, 0, 0, .7);
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 14px;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }

    .card {
      width: 100%;
      max-width: 360px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 26px;
      text-align: center;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 17px;
      font-weight: 620;
    }

    p {
      margin: 0 0 20px;
      color: var(--text-2);
      font-size: 13px;
    }

    button {
      width: 100%;
      padding: 10px 14px;
      font: inherit;
      font-weight: 600;
      font-size: 13px;
      color: #FFF;
      background: var(--brass);
      border: 1px solid var(--brass);
      border-radius: 8px;
      cursor: pointer;
    }

    button:hover {
      background: var(--brass-2);
      border-color: var(--brass-2);
    }

    button:focus-visible {
      outline: 2px solid var(--brass);
      outline-offset: 2px;
    }

    a {
      display: inline-block;
      margin-top: 12px;
      font-size: 12.5px;
      color: var(--text-2);
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Sign out</h1>
    <p>This ends your dashboard session on every tab.</p>
    <form method="POST" action="/logout">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <button type="submit">Sign out</button>
    </form>
    <a href="/">Back to the dashboard</a>
  </main>
</body>

</html>
{{end}}
