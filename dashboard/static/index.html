<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flarops dashboard</title>
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%93%A6%3C%2Ftext%3E%3C%2Fsvg%3E">
  <style>
    /* minimal reset — the hosted version gets this from its runtime */
    *,
    *::before,
    *::after {
      box-sizing: border-box
    }

    html {
      -webkit-text-size-adjust: 100%
    }

    body,
    h1,
    h2,
    h3,
    p,
    ul,
    ol,
    figure {
      margin: 0
    }

    ul,
    ol {
      padding: 0
    }

    img,
    svg {
      display: block;
      max-width: 100%
    }

    button,
    input {
      font: inherit;
      color: inherit
    }
  </style>
</head>

<body>
  <style>
    /* ============================================================
   TOKENS
   Cold slate neutrals against a warm brass accent. Brass is reserved
   for uptime and money — the one thread that means "this is billable".
   The status ramp (ok / watch / hot) is separate and never used as accent.
   ============================================================ */
    :root {
      --bg: #EEF0F4;
      --surface: #FFFFFF;
      --surface-2: #E7EAF0;
      --inset: #DDE1E9;
      --line: rgba(20, 28, 45, .12);
      --line-2: rgba(20, 28, 45, .22);
      --line-3: rgba(20, 28, 45, .34);
      --text: #12161D;
      --text-2: #4B5464;
      --text-3: #5F6774;
      --brass: #8A6A16;
      --brass-2: #A8842A;
      --brass-tint: rgba(138, 106, 22, .10);
      --brass-tint-2: rgba(138, 106, 22, .20);
      --ok: #1C7A57;
      --ok-tint: rgba(28, 122, 87, .12);
      --watch: #9A6608;
      --watch-tint: rgba(154, 102, 8, .12);
      --hot: #AE2F2C;
      --hot-tint: rgba(174, 47, 44, .12);
      --link: #2C5FA8;
      --link-tint: rgba(44, 95, 168, .10);
      --prev: #4F6EA8;
      --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 24px -12px rgba(16, 24, 40, .28);
      --shadow-sm: 0 1px 2px rgba(16, 24, 40, .07);
      --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #0D1016;
        --surface: #161A22;
        --surface-2: #1D222C;
        --inset: #0A0D12;
        --line: rgba(255, 255, 255, .09);
        --line-2: rgba(255, 255, 255, .17);
        --line-3: rgba(255, 255, 255, .28);
        --text: #E6EAF1;
        --text-2: #A2AAB9;
        --text-3: #8A92A1;
        --brass: #D9A94A;
        --brass-2: #C79A46;
        --brass-tint: rgba(217, 169, 74, .13);
        --brass-tint-2: rgba(217, 169, 74, .24);
        --ok: #46C08A;
        --ok-tint: rgba(70, 192, 138, .14);
        --watch: #E3A63C;
        --watch-tint: rgba(227, 166, 60, .14);
        --hot: #F0685E;
        --hot-tint: rgba(240, 104, 94, .15);
        --link: #7EA8E8;
        --link-tint: rgba(126, 168, 232, .13);
        --prev: #8493BC;
        --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -14px rgba(0, 0, 0, .7);
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, .35);
      }
    }

    :root[data-theme="dark"] {
      --bg: #0D1016;
      --surface: #161A22;
      --surface-2: #1D222C;
      --inset: #0A0D12;
      --line: rgba(255, 255, 255, .09);
      --line-2: rgba(255, 255, 255, .17);
      --line-3: rgba(255, 255, 255, .28);
      --text: #E6EAF1;
      --text-2: #A2AAB9;
      --text-3: #8A92A1;
      --brass: #D9A94A;
      --brass-2: #C79A46;
      --brass-tint: rgba(217, 169, 74, .13);
      --brass-tint-2: rgba(217, 169, 74, .24);
      --ok: #46C08A;
      --ok-tint: rgba(70, 192, 138, .14);
      --watch: #E3A63C;
      --watch-tint: rgba(227, 166, 60, .14);
      --hot: #F0685E;
      --hot-tint: rgba(240, 104, 94, .15);
      --link: #7EA8E8;
      --link-tint: rgba(126, 168, 232, .13);
      --prev: #8493BC;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px -14px rgba(0, 0, 0, .7);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, .35);
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 15px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--link)
    }

    :focus-visible {
      outline: 2px solid var(--brass);
      outline-offset: 2px;
      border-radius: 2px
    }

    .ic {
      width: 1em;
      height: 1em;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: none
    }

    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 24px
    }

    /* ---------------- masthead ---------------- */
    .masthead {
      padding: 46px 0 24px
    }

    .masthead h1 {
      font-size: clamp(28px, 4vw, 40px);
      line-height: 1.06;
      letter-spacing: -.025em;
      margin: 0;
      font-weight: 680
    }

    .masthead p {
      max-width: 64ch;
      color: var(--text-2);
      margin: 12px 0 0
    }


    /* ---------------- dashboard shell ---------------- */
    .board-cap {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      flex-wrap: wrap;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--text-3);
      padding-bottom: 10px;
    }

    /* Sign out lives in the caption strip rather than the fleet bar: that bar
       is rebuilt from scratch on every websocket frame, so a control placed
       there would be torn down and recreated a few times a second. */
    .signout {
      color: var(--text-3);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color .12s ease, border-color .12s ease;
    }

    .signout:hover {
      color: var(--brass);
      border-bottom-color: var(--brass);
    }

    .signout:focus-visible {
      outline: 2px solid var(--brass);
      outline-offset: 2px;
      border-radius: 2px;
    }

    @media (prefers-reduced-motion:reduce) {
      .signout {
        transition: none;
      }
    }

    .board {
      display: grid;
      /* minmax(0, ...): a long row (the data table, an instance type) scrolls inside its card
         instead of widening the page. */
      grid-template-columns: minmax(0, 1fr);
      gap: 18px;
      padding-bottom: 80px
    }

    .loading-text {
      max-width: 60ch;
      margin: 0;
      text-align: center;
      line-height: 1.6
    }

    .workerline {
      padding: 12px 22px 0;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-2)
    }

    .workerline .idle {
      color: var(--watch);
      font-weight: 600
    }

    [data-tip] {
      cursor: help
    }

    [data-tip]:focus-visible {
      outline: 2px solid var(--link);
      outline-offset: 2px;
      border-radius: 2px
    }

    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0;
      min-height: calc(100vh - 140px);
      color: var(--text-3);
      font-family: var(--font-mono);
      font-size: 13px;
      gap: 16px
    }

    .fleetbar {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 18px;
      box-shadow: var(--shadow-sm);
    }

    .fleetbar h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 640;
      letter-spacing: -.01em
    }

    .fleetbar .sep {
      flex: 1
    }

    .fleetbar .lbl {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-2);
      letter-spacing: .04em
    }

    .fleetbar .host {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--link);
      text-decoration: none;
      border-bottom: 1px solid var(--link-tint);
    }

    .fleetbar .host:hover {
      border-bottom-color: currentColor
    }

    .live {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ok);
      letter-spacing: .06em
    }

    .live.stale {
      color: var(--watch)
    }

    .live.dead {
      color: var(--hot)
    }

    .live.stale .dot,
    .live.dead .dot {
      animation: none
    }

    .live .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 2.4s ease-in-out infinite
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .3
      }
    }

    .sortnote {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-3);
      padding: 0 4px;
    }

    .sortnote .ic {
      width: 12px;
      height: 12px;
      color: var(--brass)
    }

    /* ---------------- host card ---------------- */
    .host {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: var(--shadow);
      overflow: hidden
    }

    .host.alarm {
      border-color: color-mix(in srgb, var(--hot) 45%, var(--line));
      box-shadow: var(--shadow), 0 0 0 3px var(--hot-tint)
    }

    .hhead {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 20px 22px;
      border-bottom: 1px solid var(--line)
    }

    .htop {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      flex-wrap: wrap;
      gap: 20px
    }

    .hname h3 {
      margin: 0;
      font-size: 19px;
      letter-spacing: -.015em;
      font-weight: 640
    }

    .hname {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .hname .sub {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-3);
      letter-spacing: .04em
    }

    .hchips {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .chip {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .08em;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 2px 10px;
      color: var(--text-2);
      margin-right: 7px;
    }

    .chip.type {
      color: var(--brass);
      border-color: var(--brass-tint-2);
      background: var(--brass-tint)
    }

    .spend-notes {
      margin: 10px 0 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 4px;
      font-size: 12px;
      line-height: 1.5;
      color: var(--text-2);
      max-width: 75ch
    }

    .spend-notes .assumed {
      color: var(--watch)
    }

    .chip.warn {
      color: var(--hot);
      border-color: currentColor;
      background: var(--hot-tint)
    }

    .gauges {
      display: flex;
      gap: 26px;
      margin-left: auto;
      flex-wrap: wrap
    }

    .gauge {
      display: flex;
      gap: 11px;
      align-items: center
    }

    .gauge svg {
      width: 52px;
      height: 52px;
      flex: none
    }

    .gauge .g-t {
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--text-3)
    }

    .gauge .g-v {
      font-family: var(--font-mono);
      font-size: 16px;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      line-height: 1.3
    }

    /* a rounded number with exact detail on hover */
    .exact {
      border-bottom: 1px dotted var(--line-3);
      cursor: help
    }

    .exact:hover {
      border-bottom-color: var(--brass)
    }

    .gauge .g-s {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-3)
    }

    .alarmline {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--hot);
      background: var(--hot-tint);
      padding: 9px 22px;
      border-bottom: 1px solid var(--line);
    }

    /* ---------------- memory allocation bar ----------------
   The host drawn as a bin: every capsule is a segment sized by real MiB and
   the leftover is explicit headroom. Segments are NOT colour-coded by identity
   — a four-hue categorical set fails CVD separation at this size, and the
   capsule name printed inside each segment identifies it far better. Colour
   here means state: neutral = running, blue hatch = still coming up. */
    .alloc {
      padding: 16px 22px 0;
      display: grid;
      gap: 6px
    }

    .alloc-l {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--text-3);
    }

    .stack {
      display: flex;
      overflow: hidden;
      height: 46px;
      border-radius: 5px;
      background: var(--inset);
      box-shadow: inset 0 0 0 1px var(--line);
      gap: 2px;
      padding: 2px
    }

    /* Segment width is the capsule's share of installed memory. min-width wins over
   the share so a small capsule keeps a readable label; the shares around it
   absorb the difference. */
    .seg {
      border-radius: 3px;
      flex: 0 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 9px;
      overflow: hidden;
      background: var(--surface-2);
      box-shadow: inset 0 0 0 1px var(--line-2);
    }

    .seg:not(.sys):not(.reserved):not(.free) {
      min-width: 66px
    }

    .seg>* {
      min-width: 0
    }

    .seg .sn {
      font-family: var(--font-mono);
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .seg .sv {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .seg.work {
      background-color: var(--link-tint);
      box-shadow: inset 0 0 0 1px var(--link);
      background-image: repeating-linear-gradient(135deg, transparent, transparent 5px, var(--link-tint) 5px, var(--link-tint) 10px);
    }

    .seg.work .sv {
      color: var(--link)
    }

    .seg.sys {
      box-shadow: inset 0 0 0 1px var(--line);
      min-width: 22px;
      padding: 0 5px;
      background: transparent;
      background-image: repeating-linear-gradient(135deg, transparent, transparent 3px, var(--line) 3px, var(--line) 4px);
    }

    .seg.sys .sv {
      color: var(--text-3)
    }

    /* The kubelet's reserve: present on the bar but visibly not available,
       so the gap between installed and usable memory is legible rather than
       being mistaken for free space. */
    .seg.reserved {
      background: repeating-linear-gradient(135deg,
          var(--stroke) 0 6px, transparent 6px 12px);
      opacity: .75;
    }

    .seg.free {
      background: transparent;
      box-shadow: inset 0 0 0 1px var(--line-2);
      min-width: 0;
      background-image: repeating-linear-gradient(135deg, transparent, transparent 6px, var(--surface-2) 6px, var(--surface-2) 12px);
    }

    .seg.free .sn {
      color: var(--text-2)
    }

    .seg.free .sv {
      color: var(--text-3)
    }

    /* ---------------- capsule card ---------------- */
    .caps {
      padding: 16px 22px 22px;
      display: grid;
      gap: 14px
    }

    .cap {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      overflow: hidden
    }

    .cap:hover {
      border-color: var(--line-2)
    }

    .cap.transitional {
      border-color: color-mix(in srgb, var(--link) 40%, var(--line))
    }

    .crow {
      display: flex;
      align-items: center;
      gap: 22px;
      flex-wrap: wrap;
      padding: 14px 16px;
      background: var(--surface-2)
    }

    .who {
      display: grid;
      gap: 6px;
      min-width: 250px
    }

    .who a {
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      gap: 7px;
      align-items: center;
      color: var(--link)
    }

    .who a:hover {
      text-decoration: underline
    }

    .who a .ic {
      width: 12px;
      height: 12px;
      opacity: .65
    }

    .idrow {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center
    }

    .stats {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
      margin-left: auto;
      align-items: flex-end
    }

    .stat {
      min-width: 104px
    }

    .stat .l {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--text-3)
    }

    .stat .v {
      font-family: var(--font-mono);
      font-size: 14px;
      font-variant-numeric: tabular-nums;
      color: var(--text);
      margin: 2px 0 4px
    }

    .stat .v em {
      font-style: normal;
      color: var(--text-3);
      font-size: 11px
    }

    .stat .b {
      height: 4px;
      border-radius: 2px;
      background: var(--inset);
      overflow: hidden;
      box-shadow: inset 0 0 0 1px var(--line)
    }

    .stat .b i {
      display: block;
      height: 100%;
      border-radius: 2px
    }

    /* Containers vs volumes: compute and storage are different kinds of thing, so
   they get different forms, not the same tile with a dashed border. Containers
   are square-cornered cards on the card surface — things that run. Volumes sit
   on a recessed shelf as rounded pills with a fill gauge — things that persist
   and grow, and that outlive the container above them. */
    .cbody {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(230px, 300px);
      gap: 0;
      align-items: stretch
    }

    @media (max-width:900px) {
      .cbody {
        grid-template-columns: minmax(0, 1fr)
      }
    }

    .zone {
      padding: 13px 16px;
      display: grid;
      gap: 9px;
      align-content: start
    }

    .zlabel {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--text-3);
    }

    .zlabel .n {
      color: var(--text-2);
      font-variant-numeric: tabular-nums
    }

    .zlabel .ic {
      width: 11px;
      height: 11px
    }

    /* Tile width is proportional to the container's resident memory (--w), so the
   database visibly dwarfs the nginx beside it. Proportion is a flex-grow share
   rather than a hard percentage, and min-width wins over it — a 96M sidecar
   still gets a legible box instead of a sliver. */
    .tiles {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      align-items: stretch
    }

    .tile {
      flex-grow: var(--w, 1);
      flex-shrink: 1;
      flex-basis: 0;
      min-width: 150px;
      border: 1px solid var(--line-2);
      border-radius: 3px;
      padding: 9px 12px;
      background: var(--surface);
      display: grid;
      gap: 2px;
      align-content: start;
      border-top: 2px solid var(--text-3);
    }

    .tile>* {
      min-width: 0
    }

    .tile .t-n {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--text);
      font-weight: 600
    }

    .tile .t-i {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text-3);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .tile .t-v {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-2);
      font-variant-numeric: tabular-nums;
      margin-top: 3px
    }

    /* Memory and CPU each stay whole; a narrow tile puts them on two lines instead of past its edge. */
    .tile .t-v>span {
      white-space: nowrap
    }

    .zlabel .hint {
      color: var(--text-3);
      letter-spacing: .06em;
      text-transform: none;
      font-size: 10px;

      <div class="loading-state">

  <script>
    "use strict";

    document.addEventListener("DOMContentLoaded", () => {
      const el = document.getElementById("board-host-name");
      if (el) el.innerText = window.location.hostname;
    });

    /* A first frame normally arrives within a couple of seconds. Without one, say why it may not,
       instead of spinning forever. */
    setTimeout(() => {
      if (FRAMES > 0) return;
      const t = document.getElementById("loading-text");
      if (t) t.textContent = (CONNECTED
        ? "Connected, but no data has arrived yet. The dashboard may still be collecting its first sample, or it cannot read the cluster (check its logs: kubectl logs deploy/flarops-dashboard)."
        : "Cannot reach the dashboard's live feed. It reconnects on its own; if this stays, the dashboard pod may be restarting.");
    }, 10000);

    /* ------------------------------------------------------------------
       DATA — one fleet snapshot. Capsule RAM/CPU sums stay under the host
       totals; the remainder is system + page cache.
       cores × threads × 100 = the CPU ceiling.
       ------------------------------------------------------------------ */
    const byStatusTime = (a, b) => a.statusSec - b.statusSec;

    let FLEET = { slotsUsed: 0, domain: "", appDomain: "", project: "" };
    let FRAMES = 0;
    let HOSTS = [];
    let QUEUE = [];
    let SPEND = {
      mtd: 0, prevSame: 0, runRate: 0, projected: 0,
      monthLabel: "Current", prevLabel: "Previous",
      days: [], cur: [], prev: [], deltaPct: 0
    };
    let ORDERED = [];
    let GENERATED_AT = 0;
    /* When this browser received the newest frame: its own clock, never compared with the server's. */
    let RECEIVED_AT = 0;
    let CONNECTED = false;
    let ALL_CAPS = [];
    let FLEET_RAM = 0;
    let FLEET_RAM_USED = 0;

    /* ------------------------------------------------------------------ helpers */
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const mib = n => n.toLocaleString("en-US");

    /* ---- sizes -------------------------------------------------------
       Displayed rounded and compact so columns of numbers stay scannable;
       exact MiB and the unit definition live in the hover title, because a
       dashboard is read at a glance and audited on demand. Anything under a
       gibibyte keeps MiB resolution — "84M" says more than "0.1G".        */
    const sz = m => m >= 1024 ? (m / 1024).toFixed(1) + " GiB" : Math.round(m) + " MiB";
    const szPair = (a, b) => sz(a) + " / " + sz(b);
    const szT = m => mib(m) + " MiB";
    const szPairT = (a, b, what) => mib(a) + " MiB of " + mib(b) + " MiB " + what;
    /** Marks a rounded figure as having exact detail behind it. */
    const exact = (html, title) => '<span class="exact" title="' + title + '">' + html + "</span>";
    const usd = val => "$" + (val || 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    /* "October" -> "Oct". The labels come from the server; the chart used to
       print "Aug" and "Jul" whatever month it was. Escaped like any other
       server string. */
    const monShort = label => esc(String(label || "").slice(0, 3));
    const usd0 = n => "$" + Math.round(n || 0).toLocaleString("en-US");
    const pct = (a, b) => b === 0 ? 0 : Math.round((a / b) * 100);

    /** How long an environment has been up: "<1m", "12m", "3h 05m", "2d 04h". */
    function age(min) {
      const m = Math.max(0, Math.floor(Number(min) || 0));
      const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), r = m % 60;
      if (d) return d + "d " + String(h).padStart(2, "0") + "h";
      if (h) return h + "h " + String(r).padStart(2, "0") + "m";
      return m ? m + "m" : "<1m";
    }
    /** Time in the current status — seconds-precise while it matters, coarse once it doesn't. */
    function dur(sec) {
      sec = Math.max(0, Math.floor(Number(sec) || 0));
      const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600),
        m = Math.floor(sec % 3600 / 60), s = sec % 60;
      if (d) return h ? d + "d " + h + "h" : d + "d";
      if (h) return h + "h " + m + "m";
      if (m) return m + "m " + s + "s";
      return s + "s";
    }
    /** Pressure ramp. Reserved for utilisation — never used as an accent or an identity colour. */
    function tone(p) { return p >= 85 ? "hot" : p >= 70 ? "watch" : "ok"; }
    function toneVar(p) { return "var(--" + tone(p) + ")"; }

    const cpuCap = h => h.cores * h.threads * 100;
    /* The collector reports CPU in percent of one core; shown as vCPU. */
    const vcpu = p => (p / 100).toFixed(p >= 1000 ? 1 : 2);
    const threadsOf = h => h.cores * h.threads;
    /* Memory the kubelet holds back and will never give to a pod:
       system-reserved + kube-reserved + the eviction threshold. It is a floor
       that must stay free, not a budget that gets spent. */
    const reservedOf = h => Math.max(0, (h.ramTotal || 0) - (h.ramAllocatable || 0));

    /* What a NEW capsule can actually take here. The smaller of what is
       physically unused once the reserve is kept back, and what the kubelet
       still has left to hand out. Counting raw free memory offered that floor
       out as usable, which is how a node got filled past the point where
       eviction starts. Mirrors FreeForSchedulingMiB in dashboard/capacity.go -
       the page and the capacity oracle must not disagree about what fits. */
    const freeForScheduling = h => {
      if (!h.ramTotal || !h.ramAllocatable) return 0;
      const podsUsed = (h.capsules || []).reduce((s, c) => s + c.ram, 0);
      const physical = (h.ramTotal - h.ramUsed) - reservedOf(h);
      const schedulable = h.ramAllocatable - podsUsed;
      return Math.max(0, Math.min(physical, schedulable));
    };

    /* Deliberately a share of the machine's RAM, not of what pods can have:
       this gauge answers "how full is this box", and the allocation bar below
       is where the schedulable figure lives. */
    const hostRam = h => pct(h.ramUsed, h.ramTotal);
    const hostCpu = h => pct(h.cpuUsed, cpuCap(h));
    const hostSwap = h => pct(h.swapUsed, h.swapTotal);

    /* What the collector reports (dashboard/collector.go, podCondition): failing outranks
       unplaceable, which outranks deploying. `word` is the tally's noun. */
    const STATUS = {
      running: { label: "Running", word: "running", cls: "running" },
      deploying: { label: "Deploying", word: "deploying", cls: "work" },
      degraded: { label: "Failing", word: "failing", cls: "bad" },
      waiting: { label: "Can't be placed", word: "unplaced", cls: "wait" }
    };
    const statusOf = c => STATUS[c.status] || { label: String(c.status || "unknown"), word: String(c.status || "unknown"), cls: "wait" };

    /* Namespaces are <project>-production and <project>-pr-<number> (templates/pr-capsule.yml.js). */
    const prNumber = c => { const m = /-pr-(\d+)$/.exec(c.id); return m ? +m[1] : null; };
    const isProduction = c => /-production$/.test(c.id);
    function envTag(c) {
      if (isProduction(c)) return '<span class="env-tag prod">Production</span>';
      const n = prNumber(c);
      return n !== null ? '<span class="env-tag">PR #' + n + "</span>" : '<span class="env-tag">' + esc(c.id) + "</span>";
    }
    /** Why it is not simply running, with the restart count when the reason does not carry it. */
    function whyLine(c) {
      if (!c.reason && !c.restarts) return "";
      const restarts = c.restarts && !/restarts/.test(c.reason || "") ? (c.reason ? " · " : "") + c.restarts + " restarts" : "";
      return '<div class="why-line' + (c.status === "degraded" ? "" : " soft") + '">' + esc(c.reason || "") + restarts + "</div>";
    }


    const volTotal = c => c.vol ? c.vol.reduce((s, v) => s + v.mib, 0) : 0;
    const plural = (n, word) => n + " " + word + (n === 1 ? "" : "s");
    function machinesLabel() {
      const workers = HOSTS.filter(h => h.role === "worker").length;
      return plural(HOSTS.length - workers, "server") + (workers ? " · " + plural(workers, "PR worker") : "");
    }

    function statusTally() {
      const t = {};
      ALL_CAPS.concat(QUEUE).forEach(c => { t[c.status] = (t[c.status] || 0) + 1; });
      return Object.keys(t).map(k => t[k] + " " + statusOf({ status: k }).word).join(" · ");
    }

    /* freeForScheduling is defined below and used here: the page must answer
       "does this fit" exactly as the capacity oracle does. It previously did
       not - the fleet bar subtracted the kubelet's reserve while the queue row
       did not, so one host could read "1.2G free" in its bar and "3.1G free"
       two lines down. The naive figure is also the one that overfilled a node
       badly enough to take it out. */
    /* Less what the capacity oracle has already promised to a PR environment that has not
       started yet - the oracle subtracts it too (reservedOn in dashboard/capacity.go). */
    const freeOf = h => Math.max(0, freeForScheduling(h) - (h.promisedMiB || 0));
    /* Cordoned, NotReady and unmeasured nodes are excluded here for the same
       reason planPlacement excludes them (dashboard/capacity.go): a draining
       node reports almost no usage and therefore wins on free memory, while
       nothing scheduled onto it will ever start. */
    const usableHosts = () => HOSTS.filter(h => h.schedulable !== false && h.metricsKnown !== false && h.ramAllocatable);
    const roomiest = () => {
      const usable = usableHosts();
      return usable.length > 0
        ? usable.reduce((best, h) => freeOf(h) > freeOf(best) ? h : best, usable[0])
        : { id: "", ramTotal: 0, ramUsed: 0, ramAllocatable: 0, capsules: [] };
    };

    /* A capsule's footprint is not the figure it currently reports. It grows
       after start, the kubelet keeps its own reserves, and page cache is
       charged to the pod - so planning against the raw number packs hosts to
       the point where the next capsule cannot actually land. Every placement
       decision below is made against the size a capsule really occupies:
       what it uses, plus this margin. */
    const CAPSULE_HEADROOM = 0.15;
    /* The next PR environment, sized by the server the way CI sizes it (what production uses
       now, plus headroom), so the bar, the oracle and the workflow give one answer. Never 0: it
       is a divisor. */
    const nextEnvSize = () => Math.max(1, FLEET.nextEnvMiB || 0);

    /* ------------------------------------------------------------------ fragments */
    function urlLink(c) {
      return '<a href="https://' + esc(c.host) + '" target="_blank" rel="noopener">' +
        esc(c.host) + '<svg class="ic"><use href="#i-ext"/></svg></a>';
    }
    function ageChip(c) {
      // A PR environment open for a week is a billing question; production is meant to stay up.
      const old = !isProduction(c) && c.upMin >= 10080;
      return '<span class="age' + (old ? " old" : "") + '" title="' + (old
        ? "Open " + Math.floor(c.upMin / 1440) + " days - still needed? Closing the PR removes it."
        : "Up " + age(c.upMin)) + '">' +
        '<svg class="ic"><use href="#i-clock"/></svg>' + age(c.upMin) + "</span>";
    }
    function statusPill(c) {
      const s = statusOf(c), working = s.cls === "work";
      return '<span class="st ' + s.cls + '" title="' + esc(s.label + " for " + dur(c.statusSec) + (c.reason ? " · " + c.reason : "")) + '">' +
        (working ? '<span class="ring"></span>' : '<span class="dot"></span>') +
        '<span class="lb">' + s.label + '</span><span class="d">' + dur(c.statusSec) + "</span></span>";
    }
    function deltaChip() {
      /* Nothing recorded for last month: there is no change to show, not a +0% rise. */
      if (!SPEND.prevSame) return '<span class="delta">no data for ' + esc(SPEND.prevLabel) + "</span>";
      const up = SPEND.deltaPct >= 0;
      return '<span class="delta ' + (up ? "up" : "down") + '"><svg class="ic" style="' +
        (up ? "" : "transform:rotate(180deg)") + '"><use href="#i-up"/></svg>' +
        (up ? "+" : "") + SPEND.deltaPct.toFixed(1) + "% vs " + SPEND.prevLabel + "</span>";
    }
    /* p === null: nothing to measure or no measurement - a grey ring and a dash, never a green 0. */
    /* How full a machine is for a NEW pod: the share of memory no longer free to schedule (used,
       reserved by the kubelet, promised). Colours the RAM ring, so a green ring never sits next to
       "no room for another". */
    function ramPressure(h) {
      if (h.metricsKnown === false || !h.ramTotal) return null;
      const pressure = 100 - pct(freeOf(h), h.ramTotal);
      const fits = FLEET.nextEnvMiB ? freeOf(h) >= nextEnvSize() : true;
      return fits ? pressure : Math.max(pressure, 85);
    }
    function arcGauge(label, p, value, sub, toneP) {
      const known = p !== null && p !== undefined && isFinite(p);
      const r = 21, c = 2 * Math.PI * r, dash = known ? (Math.min(p, 100) / 100) * c : 0;
      return '<div class="gauge"><svg viewBox="0 0 52 52" aria-hidden="true">' +
        '<circle cx="26" cy="26" r="' + r + '" fill="none" stroke="var(--inset)" stroke-width="5"/>' +
        '<circle cx="26" cy="26" r="' + r + '" fill="none" stroke="' + (known ? toneVar(toneP === undefined || toneP === null ? p : toneP) : "var(--line-2)") + '" stroke-width="5" ' +
        'stroke-linecap="round" stroke-dasharray="' + dash.toFixed(1) + " " + c.toFixed(1) +
        '" transform="rotate(-90 26 26)"/>' +
        '<text x="26" y="30" text-anchor="middle" font-size="13" font-family="var(--font-mono)" fill="var(--text)">' +
        (known ? p : "—") + "</text></svg><div><div class=\"g-t\">" + label + '</div><div class="g-v">' + value +
        '</div><div class="g-s">' + sub + "</div></div></div>";
    }

    /* ------------------------------------------------------------------ chart
       Two series, one axis: this month as filled bars, the same period last month
       as a dashed line. Different hue and different mark, so identity never rests
       on colour alone; legend, direct label on today, and a data table back it up.
       ------------------------------------------------------------------ */
    function chart() {
      const W = 760, H = 168, padL = 4, padR = 4, padT = 18, padB = 20;
      const n = SPEND.days.length;
      if (!n) return '<p class="note">No spend recorded yet this month.</p>';
      const maxV = Math.max.apply(null, [0].concat(SPEND.cur, SPEND.prev)) * 1.16 || 1;
      const iw = W - padL - padR, ih = H - padT - padB;
      const bw = iw / n, bar = Math.max(6, bw * 0.56);
      const y = v => padT + ih - (v / maxV) * ih;
      const cx = i => padL + bw * i + bw / 2;
      let g = "";

      const mean = SPEND.cur.reduce((a, b) => a + b, 0) / n;
      g += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(mean).toFixed(1) + '" y2="' +
        y(mean).toFixed(1) + '" stroke="var(--line-2)" stroke-width="1" stroke-dasharray="2 4"/>';
      g += '<text x="' + padL + '" y="' + (y(mean) - 5).toFixed(1) + '" font-size="9.5" ' +
        'font-family="var(--font-mono)" fill="var(--text-3)" letter-spacing=".08em">AVG ' + usd(mean) + "/DAY</text>";

      SPEND.cur.forEach((v, i) => {
        const bh = Math.max(2, padT + ih - y(v)), x = cx(i) - bar / 2, last = i === n - 1;
        g += '<rect class="bar" data-i="' + i + '" x="' + x.toFixed(1) + '" y="' + y(v).toFixed(1) +
          '" width="' + bar.toFixed(1) + '" height="' + bh.toFixed(1) + '" rx="3" fill="var(--brass' +
          (last ? "" : "-2") + ')" opacity="' + (last ? 1 : 0.88) + '"><title>' + monShort(SPEND.monthLabel) + " " + SPEND.days[i] +
          ": " + usd(v) + "</title></rect>";
      });

      let d = "";
      SPEND.prev.forEach((v, i) => { d += (i ? " L" : "M") + cx(i).toFixed(1) + " " + y(v || 0).toFixed(1); });
      g += '<path d="' + d + '" fill="none" stroke="var(--prev)" stroke-width="2" stroke-dasharray="5 4" ' +
        'stroke-linecap="round" stroke-linejoin="round"/>';
      g += '<circle cx="' + cx(n - 1).toFixed(1) + '" cy="' + y(SPEND.prev[n - 1] || 0).toFixed(1) +
        '" r="3.2" fill="var(--prev)" stroke="var(--surface)" stroke-width="2"/>';

      const lastV = SPEND.cur[n - 1];
      g += '<text x="' + cx(n - 1).toFixed(1) + '" y="' + (y(lastV) - 6).toFixed(1) +
        '" text-anchor="middle" font-size="11" font-family="var(--font-mono)" font-weight="600" ' +
        'fill="var(--brass)">' + usd(lastV) + "</text>";

      SPEND.days.forEach((day, i) => {
        if (i % 2 && i !== n - 1) return;
        g += '<text x="' + cx(i).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="10" ' +
          'font-family="var(--font-mono)" fill="var(--text-3)">' + (i === n - 1 ? "today" : day) + "</text>";
      });

      return '<svg class="spend-chart" viewBox="0 0 ' + W + " " + H +
        '" role="img" aria-label="Daily spend for ' + SPEND.monthLabel + " compared with " + SPEND.prevLabel +
        ". Month to date " + usd(SPEND.mtd) + ", " + (SPEND.deltaPct >= 0 ? "up " : "down ") +
        Math.abs(SPEND.deltaPct).toFixed(1) + " percent on the same days of " + SPEND.prevLabel + '.">' + g + "</svg>";
    }
    function chartLegend() {
      return '<div class="chart-legend">' +
        '<span><i class="swatch" style="background:var(--brass)"></i>' + SPEND.monthLabel + " (daily)</span>" +
        '<span><i class="swatch prev"></i>' + SPEND.prevLabel + " (daily)</span></div>";
    }
    /* What the estimate leaves out or had to assume - read with the figures, not hidden in a tooltip. */
    function spendNotes() {
      const notes = SPEND.notes || [];
      if (!notes.length) return "";
      return '<ul class="spend-notes">' + notes.map((n, i) =>
        '<li' + (i ? ' class="assumed"' : "") + ">" + esc(n) + "</li>").join("") + "</ul>";
    }
    function chartTable() {
      const rows = SPEND.days.map((d, i) =>
        "<tr><td>" + monShort(SPEND.monthLabel) + " " + d + "</td><td>" + usd(SPEND.cur[i]) + "</td><td>" + usd(SPEND.prev[i]) + "</td></tr>").join("");

      let breakdownHTML = "";
      if (SPEND.breakdown) {
        breakdownHTML = "<h4>Run-rate Breakdown</h4><table><thead><tr><th>Service</th><th>Daily Cost</th></tr></thead><tbody>";
        for (const [service, cost] of Object.entries(SPEND.breakdown)) {
          breakdownHTML += "<tr><td>" + esc(service) + "</td><td>" + usd(cost) + "</td></tr>";
        }
        breakdownHTML += "</tbody></table>";
      }

      return '<details class="tbl-toggle"><summary>Data table</summary><div class="scroll"><table>' +
        "<thead><tr><th>Day</th><th>" + SPEND.monthLabel + "</th><th>" + SPEND.prevLabel + "</th></tr></thead><tbody>" +
        rows + "<tr><td>Total</td><td>" + usd(SPEND.mtd) + "</td><td>" + usd(SPEND.prevSame) +
        "</td></tr></tbody></table>" + breakdownHTML + "</div></details>";
    }

    /* ------------------------------------------------------------------ render */
    function capsuleCard(c, h) {
      const tiles = c.ctr.map(x =>
        '<div class="tile" style="--w:' + x.ram + '" title="' + esc(x.n) + " · " + esc(x.img) + " · " + szT(x.ram) +
        " · " + vcpu(x.cpu) + " vCPU — box width is proportional to memory\">" +
        '<div class="t-n">' + esc(x.n) + '</div><div class="t-i">' + esc(x.img) +
        '</div><div class="t-v"><span>' + exact(sz(x.ram), szT(x.ram)) + "</span> · <span>" + vcpu(x.cpu) + " vCPU</span></div></div>").join("");

      const vols = c.vol.map(v => {
        return '<div class="vol" title="' + szT(v.mib) + '">' +
          '<svg class="ic"><use href="#i-vol"/></svg>' +
          '<span class="v-n">' + esc(v.n) + '</span>' +
          '<span class="v-s">' + sz(v.mib) + "</span></div>";
      }).join("");

      const st = (l, v, sub, p, bar) => '<div class="stat"><div class="l">' + l + '</div><div class="v">' + v +
        " <em>" + sub + "</em></div>" +
        (bar === false ? "" : '<div class="b"><i style="width:' + Math.min(p, 100) + "%;background:" +
          toneVar(p) + '"></i></div>') + "</div>";

      return '<div class="cap' + (c.status === "running" ? "" : " transitional") + '">' +
        '<div class="crow"><div class="who">' + envTag(c) + urlLink(c) +
        '<div class="idrow">' + statusPill(c) + ageChip(c) + "</div>" + whyLine(c) + "</div>" +
        '<div class="stats">' +
        st("RAM", exact(sz(c.ram), szPairT(c.ram, h.ramTotal, "on this host")),
          pct(c.ram, h.ramTotal) + "% of host", pct(c.ram, h.ramTotal)) +
        st("CPU", vcpu(c.cpu) + " vCPU",
          Math.round(c.cpu / cpuCap(h) * 100) + "% of the machine", c.cpu / cpuCap(h) * 100) +
        /* Swap is measured per machine only: an environment's share is unknown, not zero. */
        st("Swap", "—", "not measured per environment", 0, false) +
        st("Cost", usd(c.costLife), usd(c.rateH) + "/h", 0, false) +
        "</div></div>" +
        '<div class="cbody">' +
        '<div class="zone zone-ctr"><div class="zlabel">Containers <span class="n">' + c.ctr.length +
        " · " + exact(sz(c.ram), szT(c.ram) + " resident") + "</span>" +
        '<span class="hint">· width ∝ memory</span></div>' +
        '<div class="tiles">' + tiles + "</div></div>" +
        '<div class="zone zone-vol"><div class="zlabel">' +
        '<svg class="ic"><use href="#i-vol"/></svg>Volumes <span class="n">' +
        exact(sz(volTotal(c)), szT(volTotal(c)) + " across " + c.vol.length + " volumes") +
        '</span></div><div class="vols">' +
        (vols || '<span class="empty">none attached</span>') + "</div></div>" +
        "</div></div>";
    }

    /* The part of an environment's name that tells it apart: every one starts with the project. */
    const segName = c => isProduction(c) ? "prod" : prNumber(c) !== null ? "PR #" + prNumber(c) : c.id;

    function allocBar(h) {
      const sys = h.ramUsed - h.capsules.reduce((s, c) => s + c.ram, 0);
      const reserved = reservedOf(h);
      /* Shown as its own segment so the gap between "3.8G total" and what can
         actually be used is visible, instead of appearing as memory that
         mysteriously refuses to be allocated. */
      const measured = h.metricsKnown !== false, open = h.schedulable !== false;
      const promised = measured ? Math.min(h.promisedMiB || 0, freeForScheduling(h)) : 0;
      const free = measured ? freeOf(h) : 0;
      /* Whatever the three segments do not account for - the reserve already
         covered by real system usage. Keeps the bar summing to ramTotal. */
      const unlabelled = Math.max(0, h.ramTotal - h.capsules.reduce((s, c) => s + c.ram, 0) - Math.max(0, sys) - reserved - promised - free);
      /* How many more PR environments of the planned size fit here. */
      const slotSize = nextEnvSize();
      const fits = FLEET.nextEnvMiB ? Math.floor(free / slotSize) : null;
      /* A share of installed memory as flex-basis: when the minimum widths that keep labels
         readable do not all fit, every segment gives way in proportion to its size, and the bar
         never grows wider than its card. */
      const w = mib => (mib / h.ramTotal * 100).toFixed(2) + "%";

      const segs = h.capsules.map(c =>
        '<div class="seg' + (c.status === "running" ? "" : " work") + '" style="flex-basis:' + w(c.ram) +
        '" title="' + esc(c.id) + " · " + szT(c.ram) + " · " + statusOf(c).label + " " + dur(c.statusSec) + '">' +
        '<span class="sn">' + esc(segName(c)) + '</span><span class="sv">' +
        (c.status === "running" ? sz(c.ram) + " · " + pct(c.ram, h.ramTotal) + "%"
          : statusOf(c).word + " · " + dur(c.statusSec)) +
        "</span></div>").join("") +
        '<div class="seg sys" style="flex-basis:' + w(sys) + '" title="system + page cache · ' + szT(sys) + '">' +
        /* below ~5% there is no room for a legible label; the tooltip carries it */
        (sys / h.ramTotal >= 0.05 ? '<span class="sv">system usage</span>' : "") + "</div>" +
        (unlabelled > 0 ? '<div class="seg sys" style="flex-basis:' + w(unlabelled) + '" title="unallocated · ' + szT(unlabelled) + '"></div>' : "") +
        (reserved > 0
          ? '<div class="seg reserved" style="flex-basis:' + w(reserved) + '" title="reserved for the kubelet and OS · ' + szT(reserved) +
            " · never available to an environment" + '">' +
            (reserved / h.ramTotal >= 0.05 ? '<span class="sv">reserved</span>' : "") + "</div>"
          : "") +
        (promised > 0
          ? '<div class="seg reserved" style="flex-basis:' + w(promised) + '" title="promised to a PR environment that is being placed · ' + szT(promised) + '">' +
            (promised / h.ramTotal >= 0.05 ? '<span class="sv">promised</span>' : "") + "</div>"
          : "") +
        '<div class="seg free" style="flex-basis:' + w(free) + '" title="' + szT(free) +
        " schedulable · a new PR environment is planned at " + sz(slotSize) + ": " + esc(FLEET.nextEnvBasis || "") +
        ", plus " + Math.round(CAPSULE_HEADROOM * 100) + "% headroom" + '">' +
        '<span class="sn">' + (measured ? sz(free) : "—") + ' free</span><span class="sv">' +
        (!measured ? "no measurement" : !open ? "not accepting new pods" : fits === null ? "" : fits > 0
          ? "room for " + fits + " more PR environment" + (fits === 1 ? "" : "s") : "no room for another PR environment") +
        "</span></div>";

      return '<div class="alloc"><div class="alloc-l"><span>Memory allocation · ' +
        exact(sz(h.ramTotal) + " total", szT(h.ramTotal) + " installed") + "</span><span>" +
        (measured ? hostRam(h) + "% used · " + exact(sz(free) + " free", szT(free) + " schedulable, after " + szT(reserved) + " reserved")
          : "usage not measured - metrics-server or the node agent did not answer") +
        '</span></div><div class="stack">' + segs + "</div></div>";
    }

    /* A worker exists for PR environments: say which it carries, or that an empty one is still
       billed until the next closed PR removes it (the teardown in pr-capsule.yml reclaims idle workers). */
    function workerLine(h) {
      if (h.role !== "worker") return "";
      const since = h.createdAt ? " · added " + dur(Math.max(0, Math.round(Date.now() / 1000 - h.createdAt))) + " ago" : "";
      const prs = h.capsules.map(prNumber).filter(n => n !== null).map(n => "PR #" + n);
      return '<div class="workerline">' + (h.capsules.length
        ? "Runs " + (prs.length ? prs.join(", ") : plural(h.capsules.length, "environment")) + since
        : '<span class="idle">Idle</span>' + since + " · still billed " + usd(h.rate * 24) +
          "/day · removed when the next PR environment closes") + "</div>";
    }

    /** Swap is measured per machine, not per environment: point at the largest resident instead. */
    function worstSwapper(h) {
      const c = h.capsules.slice().sort((a, b) => b.ram - a.ram)[0];
      return c ? "the largest environment here is " + esc(c.id) + " at " + sz(c.ram) + " resident (swap per environment is not measured)"
        : "swap per environment is not measured";
    }

    /* A queued capsule has a spec but no measurements, so it gets its own compact row
       rather than a capsule card with empty gauges. Its domain is plain text, not a
       link — nothing is serving there yet. */
    function queueRow(c) {
      const best = roomiest(), memoryFits = best.id !== "" && (c.reqRam || 0) <= freeOf(best);
      return '<div class="qrow">' +
        '<div class="qid">' + esc(c.host) + '<span class="u">' + envTag(c) + " · no node can take its pods</span>" + whyLine(c) + "</div>" +
        "<div>" + statusPill(c) + "</div>" +
        '<div class="qreq">requests <b>' + exact(sz(c.reqRam || 0), szT(c.reqRam || 0) + " requested") + "</b><br>" +
        (best.id === ""
          ? '<span class="why"><svg class="ic"><use href="#i-warn"/></svg>no measured host is accepting pods</span>'
          : memoryFits
            ? '<span class="note">' + esc(best.id) + " has " + sz(freeOf(best)) + " free, so memory is not what blocks it - see the scheduler's message</span>"
            : '<span class="why"><svg class="ic"><use href="#i-warn"/></svg>largest free block is ' + sz(freeOf(best)) + " on " + esc(best.id) + "</span>") + "</div>" +
        '<div class="qspec">' +
        c.ctr.map(x => '<span class="s">' + esc(x.n) + "</span>").join("") +
        c.vol.map(v => '<span class="s v">' + esc(v.n) + "</span>").join("") +
        "</div></div>";
    }

    function queueSection() {
      if (!QUEUE.length) return "";
      return '<div class="queue"><div class="qhead"><h3>Can\'t be placed</h3>' +
        '<span class="note">' + QUEUE.length + (QUEUE.length === 1 ? " environment" : " environments") +
        " · the scheduler found no node for their pods</span>" +
        '<span class="sep"></span><span class="note">longest wait ' +
        dur(Math.max.apply(null, QUEUE.map(c => c.statusSec))) + "</span></div>" +
        QUEUE.slice().sort(byStatusTime).map(queueRow).join("") + "</div>";
    }

    function hostCard(h) {
      const agent = h.agentKnown !== false;
      const alarm = agent && h.swapTotal > 0 && h.swapUsed / h.swapTotal >= 0.5;
      const diskPct = agent && h.diskTotal ? Math.round(h.diskUsed / h.diskTotal * 100) : null;
      /* local-path volumes and every image live on this disk; past ~90% the kubelet starts evicting. */
      const diskAlarm = diskPct !== null && diskPct >= 90;
      return '<div class="host' + (alarm || diskAlarm ? " alarm" : "") + '">' +
        '<div class="hhead"><div class="htop"><div class="hname"><h3>' + esc(h.id) + "</h3>" +
        '<div class="sub">' + esc(h.region) + "</div></div>" +
        '<div class="gauges">' +
        arcGauge("RAM", hostRam(h),
          exact(szPair(h.ramUsed, h.ramTotal), szPairT(h.ramUsed, h.ramTotal, "used")), "used", ramPressure(h)) +
        (!agent ? arcGauge("Swap", null, "—", "not measured")
          : !h.swapTotal ? arcGauge("Swap", null, "none", "no swap configured")
          : arcGauge("Swap", hostSwap(h), exact(szPair(h.swapUsed, h.swapTotal), szPairT(h.swapUsed, h.swapTotal, "swapped")), "swapped")) +
        (diskPct === null ? arcGauge("Disk", null, "—", "node agent not answering")
          : arcGauge("Disk", diskPct, exact(szPair(h.diskUsed, h.diskTotal), szPairT(h.diskUsed, h.diskTotal, "used")), "used")) +
        arcGauge("CPU", hostCpu(h), vcpu(h.cpuUsed) + " / " + threadsOf(h) + " vCPU", "in use") +
        "</div></div>" +
        '<div class="hchips"><span class="chip">' + (h.role === "worker" ? "PR worker" : "server") + "</span>" +
        (h.schedulable === false ? '<span class="chip warn" title="Cordoned, not ready or tainted: new pods will not land here">not schedulable</span>' : "") +
        (h.metricsKnown === false ? '<span class="chip warn" title="metrics-server or the node agent did not answer; usage below reads as zero">no metrics</span>' : "") +
        (h.priceKnown === false ? '<span class="chip warn" title="The price feed has no price for this type and region yet; a fallback rate is used">price estimated</span>' : "") +
        (h.type ? '<span class="chip type">' + esc(h.type) + "</span>" : "") + '<span class="chip">' + plural(threadsOf(h), "vCPU") +
        '</span><span class="chip">' + usd(h.rate) + "/h</span></div></div>" +
        (alarm ? '<div class="alarmline"><svg class="ic"><use href="#i-warn"/></svg>Swap pressure ' +
          hostSwap(h) + "% — " + worstSwapper(h) + ". This host is over-committed, not busy.</div>" : "") +
        (diskAlarm ? '<div class="alarmline"><svg class="ic"><use href="#i-warn"/></svg>Disk ' + diskPct +
          "% full — images and local-path volumes live here, and past this point the kubelet evicts pods. Free space or grow the volume.</div>" : "") +
        workerLine(h) +
        allocBar(h) +
        '<div class="caps">' + h.capsules.map(c => capsuleCard(c, h)).join("") + "</div></div>";
    }

    /* Brings `from`'s children in line with `to`'s, touching only what differs, so a frame every
       2s keeps keyboard focus, a text selection, an open hover title and the scroll position. A
       <details> keeps the open state the viewer gave it. */
    function morphChildren(from, to) {
      const fc = Array.from(from.childNodes), tc = Array.from(to.childNodes);
      tc.forEach((t, i) => {
        const f = fc[i];
        if (!f) from.appendChild(t);
        else if (f.nodeType !== t.nodeType || f.nodeName !== t.nodeName) from.replaceChild(t, f);
        else if (f.nodeType !== 1) { if (f.nodeValue !== t.nodeValue) f.nodeValue = t.nodeValue; }
        else {
          for (const a of Array.from(f.attributes)) {
            if (!t.hasAttribute(a.name) && !(f.nodeName === "DETAILS" && a.name === "open")) f.removeAttribute(a.name);
          }
          for (const a of Array.from(t.attributes)) {
            if (f.getAttribute(a.name) !== a.value) f.setAttribute(a.name, a.value);
          }
          morphChildren(f, t);
        }
      });
      for (let i = fc.length - 1; i >= tc.length; i--) from.removeChild(fc[i]);
    }

    function render(root) {
      const tpl = document.createElement("template");
      tpl.innerHTML =
        '<div class="fleetbar"><h2>' + esc(FLEET.project || "Deployment") + "</h2>" +
        freshness() +
        (FLEET.appDomain ? '<a class="host" href="https://' + esc(FLEET.appDomain) + '" target="_blank" rel="noopener">' + esc(FLEET.appDomain) + "</a>" : "") +
        '<span class="sep"></span>' +
        '<span class="lbl">' + machinesLabel() + "</span>" +
        '<span class="sep"></span>' +
        '<span class="lbl">' + plural(ALL_CAPS.length + QUEUE.length, "environment") + " · " + statusTally() + "</span>" +
        '<span class="lbl">' +
        exact(szPair(FLEET_RAM_USED, FLEET_RAM), szPairT(FLEET_RAM_USED, FLEET_RAM, "across all machines")) +
        "</span></div>" +
        '<div class="sortnote"><svg class="ic"><use href="#i-sort"/></svg>' +
        "Server first, then PR workers · production first, then by time in current status</div>" +
        queueSection() +
        ORDERED.map(hostCard).join("") +
        '<div class="money"><div class="head"><h3>Spend — ' + SPEND.monthLabel + "</h3>" + chartLegend() + "</div>" +
        '<div class="figs">' +
        '<div class="fig"><div class="l">Month to date · estimate</div><div class="v">' + usd(SPEND.mtd) + "</div>" +
        deltaChip() + "</div>" +
        '<div class="fig"><div class="l">' + SPEND.prevLabel + '</div><div class="v sm">' +
        usd(SPEND.prevSame) + "</div></div>" +
        '<div class="fig"><div class="l">Run-rate</div><div class="v sm">' + usd(SPEND.runRate) + "/day</div></div>" +
        '<div class="fig"><div class="l">Projected month</div><div class="v sm">' + usd0(SPEND.projected) + "</div></div>" +
        "</div>" + chart() + spendNotes() + chartTable() + "</div>";
      /* title= shows only on mouse hover. Each explanation becomes data-tip on an element that
         can take focus, shown by the tip layer on hover, focus or tap, and announced by it. */
      tpl.content.querySelectorAll("[title]").forEach(el => {
        el.setAttribute("data-tip", el.getAttribute("title"));
        el.removeAttribute("title");
        if (!el.matches("a, button, input, summary, [tabindex]")) el.setAttribute("tabindex", "0");
      });
      morphChildren(root, tpl.content);
    }
    function connectWS() {
      const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(wsProtocol + '//' + window.location.host + '/ws');
      ws.onopen = function () { CONNECTED = true; };
      ws.onmessage = function (e) {
        const data = JSON.parse(e.data);
        /* A repeat of the last frame (the collector resends it when a cycle fails) is not news. */
        if (!data.generatedAt || data.generatedAt !== GENERATED_AT) RECEIVED_AT = Date.now();
        GENERATED_AT = data.generatedAt || 0;
        FLEET = data.FLEET;
        FRAMES++;
        if (FLEET.project) {
          document.title = FLEET.project + " · Flarops dashboard";
          const bp = document.getElementById("board-project");
          if (bp) bp.textContent = FLEET.project;
        }
        HOSTS = data.HOSTS;
        QUEUE = data.QUEUE;
        SPEND = data.SPEND;

        /* The collector sends the server first; production leads its host. */
        ORDERED = HOSTS.map(h => Object.assign({}, h, {
          capsules: h.capsules.slice().sort((a, b) => (isProduction(b) - isProduction(a)) || byStatusTime(a, b))
        }));
        ALL_CAPS = HOSTS.flatMap(h => h.capsules);
        FLEET_RAM = HOSTS.reduce((s, h) => s + h.ramTotal, 0);
        FLEET_RAM_USED = HOSTS.reduce((s, h) => s + h.ramUsed, 0);

        render(document.querySelector('[data-render="board"]'));
      };
      ws.onclose = function () {
        CONNECTED = false;
        updateFreshness();
        /* A closed socket is often an expired session: the upgrade then gets 401 and the page would
           otherwise retry forever on frozen numbers. The page itself redirects to /login when signed out. */
        fetch("/", { cache: "no-store", redirect: "manual" }).then(r => {
          if (r.type === "opaqueredirect" || r.status === 401 || r.redirected) window.location.href = "/login";
          else setTimeout(connectWS, 2000);
        }).catch(() => setTimeout(connectWS, 2000));
      };
    }
    connectWS();

    /* How old the numbers on screen are, ticking between frames: a frame arrives every 2s, so
       a gap of 10s means the collector or the connection is stuck. */
    function freshnessState() {
      const ageSec = RECEIVED_AT ? Math.max(0, Math.round((Date.now() - RECEIVED_AT) / 1000)) : null;
      if (!CONNECTED) return { cls: "dead", text: "disconnected · reconnecting" + (ageSec !== null ? " · data " + dur(ageSec) + " old" : "") };
      if (ageSec === null) return { cls: "stale", text: "waiting for data" };
      if (ageSec >= 60) return { cls: "dead", text: "no update for " + dur(ageSec) };
      if (ageSec >= 10) return { cls: "stale", text: "updated " + dur(ageSec) + " ago" };
      return { cls: "", text: "live" };
    }
    function freshness() {
      const f = freshnessState();
      return '<span class="live ' + f.cls + '" id="freshness" role="status"><span class="dot"></span>' + f.text + "</span>";
    }
    function updateFreshness() {
      const el = document.getElementById("freshness");
      if (!el) return;
      const f = freshnessState();
      el.className = "live " + f.cls;
      el.lastChild.textContent = f.text;
    }
    setInterval(updateFreshness, 1000);

    /* hover layer for the spend chart */
    const tip = document.getElementById("tip");
    document.addEventListener("mouseover", e => {
      const b = e.target.closest && e.target.closest("rect.bar");
      if (!b) return;
      tip.className = "";
      const i = +b.dataset.i, d = SPEND.days[i], c = SPEND.cur[i], p = SPEND.prev[i];
      const diff = p > 0 ? ((c - p) / p) * 100 : null;
      tip.innerHTML = '<div class="t-d">' + monShort(SPEND.monthLabel) + " " + d + (i === SPEND.days.length - 1 ? " · today" : "") + "</div>" +
        '<div class="t-r"><i>this month</i><span>' + usd(c) + "</span></div>" +
        '<div class="t-r"><i>' + monShort(SPEND.prevLabel) + " " + d + "</i><span>" + usd(p) + "</span></div>" +
        '<div class="t-r"><i>change</i><span style="color:var(--' + (diff === null ? "text-3" : diff >= 0 ? "hot" : "ok") + ')">' +
        (diff === null ? "—" : (diff >= 0 ? "+" : "") + diff.toFixed(0) + "%") + "</span></div>";
      tip.style.opacity = "1";
    });
    document.addEventListener("mousemove", e => {
      if (tip.style.opacity !== "1") return;
      tip.style.left = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8) + "px";
      tip.style.top = Math.max(8, e.clientY - tip.offsetHeight - 12) + "px";
    });
    document.addEventListener("mouseout", e => {
      if (e.target.closest && (e.target.closest("rect.bar") || e.target.closest("[data-tip]"))) hideTip();
    });

    /* Explanations (data-tip): hover with a mouse, focus with the keyboard, tap on a touch screen. */
    let tipOwner = null, tipShownAt = 0;
    function showTip(el, x, y) {
      tipOwner = el;
      tipShownAt = Date.now();
      tip.className = "text";
      tip.textContent = el.getAttribute("data-tip");
      /* Measured at the left edge: left where it last was, near the right edge, the box would be
         squeezed narrow and the text would spill out of it. */
      tip.style.left = "0px";
      tip.style.top = "0px";
      tip.style.opacity = "1";
      const r = el.getBoundingClientRect();
      const left = x !== undefined ? x + 14 : r.left;
      const top = y !== undefined ? y - tip.offsetHeight - 12 : r.top - tip.offsetHeight - 8;
      tip.style.left = Math.max(8, Math.min(left, window.innerWidth - tip.offsetWidth - 8)) + "px";
      tip.style.top = (top < 8 ? r.bottom + 8 : top) + "px";
    }
    function hideTip() {
      tipOwner = null;
      tip.className = "";
      tip.style.opacity = "0";
    }
    document.addEventListener("mouseover", e => {
      const el = e.target.closest && e.target.closest("[data-tip]");
      if (el) showTip(el, e.clientX, e.clientY);
    });
    document.addEventListener("focusin", e => {
      const el = e.target.closest && e.target.closest("[data-tip]");
      if (el) showTip(el); else hideTip();
    });
    document.addEventListener("focusout", hideTip);
    document.addEventListener("keydown", e => { if (e.key === "Escape") hideTip(); });
    document.addEventListener("click", e => {
      const el = e.target.closest && e.target.closest("[data-tip]");
      if (!el) { hideTip(); return; }
      if (el.matches("a")) return;
      /* A tap focuses first, then clicks: the click that follows its own focus keeps the tip open. */
      if (tipOwner === el && Date.now() - tipShownAt > 400) hideTip(); else showTip(el);
    });
  </script>
</body>

</html>
